name: SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-24.04
    env:
      VITE_PORTFOLIO_NAME: "Dhyana Swain"
      VITE_PORTFOLIO_EMAIL: "dhyana_swain@yahoo.com"
      VITE_PORTFOLIO_GITHUB: "https://github.com/dhyanaswain"
      VITE_PORTFOLIO_LINKEDIN: "https://www.linkedin.com/in/dhyana-swain"
      VITE_PORTFOLIO_TITLE: "Senior Software Engineer"
      VITE_PORTFOLIO_LOCATION: "Bangalore, India"
      VITE_PORTFOLIO_SUMMARY: "I build reliable software systems, product experiences, and scalable platform work with a strong focus on business impact, maintainability, and thoughtful engineering."

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
