name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITE_PORTFOLIO_NAME: "Dhyana Swain"
      VITE_PORTFOLIO_EMAIL: "dhyana_swain@yahoo.com"
      VITE_PORTFOLIO_GITHUB: "https://github.com/dhyanaswain"
      VITE_PORTFOLIO_LINKEDIN: "https://www.linkedin.com/in/dhyana-swain"
      VITE_PORTFOLIO_TITLE: "Senior Software Engineer"
      VITE_PORTFOLIO_LOCATION: "Bangalore, India"
      VITE_PORTFOLIO_SUMMARY: "I build reliable software systems, product experiences, and scalable platform work with a strong focus on business impact, maintainability, and thoughtful engineering."

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
